<!-- Status Page -->
<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Project Status - Aura Spatial</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;family=Public+Sans:wght@300;400;500;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .gantt-grid-lines {
            stroke: #e2e8f0;
        }
        .gantt-bar-bg {
            fill: #f1f5f9;
            transition: fill 0.2s;
        }
        .task-group:hover .gantt-bar-bg {
            fill: #e2e8f0;
        }
        .gantt-bar-label {
            fill: white;
            font-size: 12px;
            font-weight: 500;
            pointer-events: none;
        }
        .gantt-dependency-line {
            stroke: #fbbf24;
            stroke-width: 2;
            fill: none;
            marker-end: url(#arrow);
        }
        .today-marker {
            stroke: #ef4444;
            stroke-width: 2;
            stroke-dasharray: 6, 4;
        }
        .tooltip {
            background-color: #1f2937;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 100;
        }
    </style>
</head>
<body class="bg-surface font-body-md text-on-surface">
    <header class="fixed top-0 w-full z-50 bg-surface dark:bg-inverse-surface border-b-2 border-outline-variant dark:border-outline">
        <div class="flex justify-between items-center px-container-padding h-20 w-full max-w-[1440px] mx-auto">
            <h1 class="font-heritage-heading text-headline-lg text-primary dark:text-inverse-primary tracking-tight"><a href="/">Aura Spatial</a></h1>
            <nav class="hidden md:flex gap-8 items-center">
                <a class="font-heritage-heading text-headline-md text-on-surface-variant dark:text-surface-variant hover:text-primary transition-colors duration-300" href="/explore">Explore</a>
                <a class="font-heritage-heading text-headline-md text-on-surface-variant dark:text-surface-variant hover:text-primary transition-colors duration-300" href="https://auraspatial3.pages.dev/marketplace">Marketplace</a>
                <a class="font-heritage-heading text-headline-md text-primary dark:text-inverse-primary border-b-2 border-primary pb-1" href="/status/index.html">Status of my project</a>
                <a class="font-heritage-heading text-headline-md text-on-surface-variant dark:text-surface-variant hover:text-primary transition-colors duration-300" href="https://pricing-new.pages.dev/">Membership/Pricing</a>
            </nav>
            <div class="flex items-center gap-6"></div>
        </div>
    </header>
    <main class="pt-20">
        <section class="px-container-padding py-12 max-w-[1440px] mx-auto">
            <h2 class="font-heritage-heading text-display-lg text-primary mb-8">Project Gantt Chart</h2>
            <div class="bg-white rounded-lg shadow-md p-6 relative">
                <div id="tooltip" class="tooltip" style="opacity:0; position: absolute;"></div>
                <svg id="gantt-chart" width="100%" height="700"></svg>
            </div>
        </section>
    </main>
    <script>
        const tasks = [
    {
        "id": 1,
        "name": "Secure Updated Quotes & Sign Contract",
        "category": "Admin",
        "start": "2026-03-29",
        "end": "2026-04-05",
        "notes": "Quotes expired on 28 Mar 2026.",
        "dependencies": [],
        "progress": 100
    },
    {
        "id": 2,
        "name": "Order Furniture (incl. Custom Items)",
        "category": "Furniture",
        "start": "2026-04-06",
        "end": "2026-05-31",
        "notes": "Order early to align with move-in [1-3].",
        "dependencies": [1, 3],
        "progress": 50
    },
    {
        "id": 3,
        "name": "Order Appliances",
        "category": "Appliances",
        "start": "2026-04-06",
        "end": "2026-04-20",
        "notes": "Coordinate delivery post-renovation [1-3].",
        "dependencies": [1],
        "progress": 80
    },
    {
        "id": 4,
        "name": "Aircon Site Survey",
        "category": "Appliance",
        "start": "2026-08-24",
        "end": "2026-08-31",
        "notes": "Required to check trunking and access [4-6].",
        "dependencies": [6],
        "progress": 10
    },
    {
        "id": 5,
        "name": "Submit HDB Permits",
        "category": "Renovation",
        "start": "2026-08-01",
        "end": "2026-08-31",
        "notes": "Must be done by appointed contractor [7-9].",
        "dependencies": [],
        "progress": 100
    },
    {
        "id": 6,
        "name": "Key Collection",
        "category": "Admin",
        "start": "2026-09-01",
        "end": "2026-09-01",
        "notes": "Project Start Date.",
        "dependencies": [],
        "progress": 100
    },
    {
        "id": 7,
        "name": "Preliminaries & Site Protection",
        "category": "Renovation",
        "start": "2026-09-01",
        "end": "2026-09-07",
        "notes": "First 10% milestone payment usually due [7, 10].",
        "dependencies": [6],
        "progress": 25
    },
    {
        "id": 8,
        "name": "Hacking & Disposal",
        "category": "Renovation",
        "start": "2026-09-08",
        "end": "2026-09-14",
        "notes": "Requires approved HDB permits [7, 10, 11].",
        "dependencies": [5, 7],
        "progress": 0
    },
    {
        "id": 9,
        "name": "Masonry, Flooring & Ceiling works",
        "category": "Renovation",
        "start": "2026-09-15",
        "end": "2026-10-12",
        "notes": "Mid-stage (40% payment milestone typically triggers here) [7, 10, 11].",
        "dependencies": [8],
        "progress": 0
    },
    {
        "id": 10,
        "name": "Electrical, Plumbing & Aircon Trunking",
        "category": "Reno/Appliance",
        "start": "2026-10-13",
        "end": "2026-10-26",
        "notes": "Coordinate aircon trunking with electrical works [12-14].",
        "dependencies": [4, 9],
        "progress": 0
    },
    {
        "id": 11,
        "name": "Carpentry Installation",
        "category": "Renovation",
        "start": "2026-10-27",
        "end": "2026-11-16",
        "notes": "Kitchen cabinets, wardrobes, TV consoles [10-12, 15].",
        "dependencies": [9],
        "progress": 0
    },
    {
        "id": 12,
        "name": "Painting",
        "category": "Renovation",
        "start": "2026-11-17",
        "end": "2026-11-23",
        "notes": "Whole unit [10, 15, 16].",
        "dependencies": [11],
        "progress": 0
    },
    {
        "id": 13,
        "name": "Appliance & Furniture Delivery",
        "category": "Logistics",
        "start": "2026-11-24",
        "end": "2026-11-30",
        "notes": "Ensure site is clean and dust-free.",
        "dependencies": [12],
        "progress": 0
    },
    {
        "id": 14,
        "name": "Final Handover & Rectification",
        "category": "Renovation",
        "start": "2026-12-01",
        "end": "2026-12-07",
        "notes": "Final 10% milestone payment due [7-9].",
        "dependencies": [13],
        "progress": 0
    }
];

        const ganttChart = document.getElementById('gantt-chart');
        const tooltip = document.getElementById('tooltip');
        const taskCount = tasks.length;
        const rowHeight = 40;
        const headerHeight = 60;
        const padding = 30;
        const taskNameWidth = 250;

        const svgHeight = taskCount * rowHeight + headerHeight + padding * 2;
        ganttChart.setAttribute('height', svgHeight);

        const categoryColors = {
            'Admin': { main: '#f87171', light: '#fca5a5' },
            'Furniture': { main: '#60a5fa', light: '#93c5fd' },
            'Appliances': { main: '#4ade80', light: '#86efac' },
            'Appliance': { main: '#4ade80', light: '#86efac' },
            'Renovation': { main: '#fb923c', light: '#fdba74' },
            'Reno/Appliance': { main: '#c084fc', light: '#d8b4fe' },
            'Logistics': { main: '#94a3b8', light: '#cbd5e1' }
        };

        const minDate = new Date(Math.min(...tasks.map(t => new Date(t.start))));
        minDate.setDate(minDate.getDate() - 7);
        const maxDate = new Date(Math.max(...tasks.map(t => new Date(t.end))));
        maxDate.setDate(maxDate.getDate() + 7);

        const chartWidth = ganttChart.clientWidth - padding * 2 - taskNameWidth;

        const timeScale = (date) => {
            return (new Date(date) - minDate) / (maxDate - minDate) * chartWidth;
        };

        // --- Draw Header and Grid ---
        const header = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        let currentMonth = -1;
        for (let d = new Date(minDate); d <= maxDate; d.setDate(d.getDate() + 1)) {
            if (d.getMonth() !== currentMonth) {
                currentMonth = d.getMonth();
                const x = timeScale(d) + padding + taskNameWidth;
                const monthText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                monthText.setAttribute('x', x);
                monthText.setAttribute('y', headerHeight - 30);
                monthText.setAttribute('class', 'font-semibold');
                monthText.textContent = `${monthNames[currentMonth]} ${d.getFullYear()}`;
                header.appendChild(monthText);
            }
        }
        ganttChart.appendChild(header);

        for (let i = 0; i <= taskCount; i++) {
            const y = headerHeight + padding + i * rowHeight;
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', 0);
            line.setAttribute('y1', y);
            line.setAttribute('x2', '100%');
            line.setAttribute('y2', y);
            line.setAttribute('class', 'gantt-grid-lines');
            ganttChart.appendChild(line);
        }

        // --- Define Arrow for Dependencies ---
        const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
        const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
        marker.setAttribute('id', 'arrow');
        marker.setAttribute('viewBox', '0 0 10 10');
        marker.setAttribute('refX', '8');
        marker.setAttribute('refY', '5');
        marker.setAttribute('markerWidth', '6');
        marker.setAttribute('markerHeight', '6');
        marker.setAttribute('orient', 'auto-start-reverse');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M 0 0 L 10 5 L 0 10 z');
        path.setAttribute('fill', '#fbbf24');
        marker.appendChild(path);
        defs.appendChild(marker);
        ganttChart.appendChild(defs);


        // --- Draw Tasks, Tooltips, and Dependencies ---
        tasks.forEach((task, i) => {
            const y = headerHeight + padding + i * rowHeight + rowHeight / 4;
            const x = timeScale(task.start) + padding + taskNameWidth;
            const width = Math.max(1, timeScale(task.end) - timeScale(task.start));

            const taskGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            taskGroup.setAttribute('class', 'task-group');

            // Task Name
            const nameText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            nameText.setAttribute('x', padding);
            nameText.setAttribute('y', y + 8);
            nameText.textContent = task.name;
            taskGroup.appendChild(nameText);
            
            // Bar background
            const bgRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            bgRect.setAttribute('x', x);
            bgRect.setAttribute('y', y - 5);
            bgRect.setAttribute('width', chartWidth - (x - padding - taskNameWidth));
            bgRect.setAttribute('height', rowHeight - 10);
            bgRect.setAttribute('class', 'gantt-bar-bg');
            bgRect.setAttribute('rx', 3);
            taskGroup.appendChild(bgRect);

            // Main task bar
            const colors = categoryColors[task.category] || { main: '#94a3b8', light: '#cbd5e1' };
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', x);
            rect.setAttribute('y', y - 5);
            rect.setAttribute('width', width);
            rect.setAttribute('height', rowHeight - 10);
            rect.setAttribute('fill', colors.main);
            rect.setAttribute('rx', 3);
            taskGroup.appendChild(rect);

            // Progress bar
            const progressWidth = width * (task.progress / 100);
            const progressRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            progressRect.setAttribute('x', x);
            progressRect.setAttribute('y', y - 5);
            progressRect.setAttribute('width', progressWidth);
            progressRect.setAttribute('height', rowHeight - 10);
            progressRect.setAttribute('fill', colors.light);
            progressRect.setAttribute('rx', 3);
            taskGroup.appendChild(progressRect);

            // Label on bar
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', x + 5);
            text.setAttribute('y', y + 12);
            text.setAttribute('class', 'gantt-bar-label');
            text.textContent = `${task.progress}%`;
            taskGroup.appendChild(text);

            // Tooltip events
            taskGroup.addEventListener('mousemove', (event) => {
                tooltip.style.opacity = 1;
                tooltip.style.left = (event.pageX + 15) + 'px';
                tooltip.style.top = (event.pageY + 15) + 'px';
                tooltip.innerHTML = `
                    <div class="font-bold">${task.name}</div>
                    <div><strong>Dates:</strong> ${task.start} to ${task.end}</div>
                    <div><strong>Category:</strong> ${task.category}</div>
                    ${task.notes ? `<div><strong>Notes:</strong> ${task.notes}</div>` : ''}
                `;
            });
            taskGroup.addEventListener('mouseleave', () => {
                tooltip.style.opacity = 0;
            });

            ganttChart.appendChild(taskGroup);
        });

        // --- Draw Dependencies ---
        const dependencyLayer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        tasks.forEach((task, i) => {
            if (task.dependencies) {
                task.dependencies.forEach(depId => {
                    const depTask = tasks.find(t => t.id === depId);
                    if (depTask) {
                        const depIndex = tasks.indexOf(depTask);
                        const startX = timeScale(depTask.end) + padding + taskNameWidth;
                        const startY = headerHeight + padding + depIndex * rowHeight + rowHeight / 2;
                        const endX = timeScale(task.start) + padding + taskNameWidth;
                        const endY = headerHeight + padding + i * rowHeight + rowHeight / 2;
                        
                        const depPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        depPath.setAttribute('d', `M ${startX} ${startY} C ${startX + 50} ${startY} ${endX - 50} ${endY} ${endX} ${endY}`);
                        depPath.setAttribute('class', 'gantt-dependency-line');
                        dependencyLayer.appendChild(depPath);
                    }
                });
            }
        });
        ganttChart.appendChild(dependencyLayer);

        // --- Draw 'Today' Marker ---
        const today = new Date();
        if (today >= minDate && today <= maxDate) {
            const todayX = timeScale(today) + padding + taskNameWidth;
            const todayLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            todayLine.setAttribute('x1', todayX);
            todayLine.setAttribute('y1', headerHeight);
            todayLine.setAttribute('x2', todayX);
            todayLine.setAttribute('y2', svgHeight - padding);
            todayLine.setAttribute('class', 'today-marker');
            ganttChart.appendChild(todayLine);

            const todayText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            todayText.setAttribute('x', todayX + 5);
            todayText.setAttribute('y', headerHeight - 5);
            todayText.setAttribute('fill', '#ef4444');
            todayText.textContent = 'Today';
            ganttChart.appendChild(todayText);
        }
    </script>
</body>
</html>
